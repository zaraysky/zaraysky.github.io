---
layout: default
---

<article>
  <header class="post-header">
    <a class="back-link" href="{{ '/' | relative_url }}">&larr; Все статьи</a>
    <h1>{{ page.title }}</h1>
    <div class="post-meta">
      <time class="post-date" datetime="{{ page.date | date_to_xmlschema }}">{% include ru_date.html date=page.date %}</time>
      {% if page.tags and page.tags.size > 0 %}
        <div class="tags">
          {% for tag in page.tags %}
            <span class="tag">{{ tag }}</span>
          {% endfor %}
        </div>
      {% endif %}
    </div>
  </header>

  <div class="prose">
    {{ content }}
  </div>
</article>
