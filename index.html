---
layout: default
title: Главная
---

<h1>Статьи</h1>

<ul>
  {% for post in site.posts %}
    <li>
      <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
      <span>{{ post.date | date: "%B %d, %Y" }}</span>
      <ul>
        {% for tag in post.tags %}
          <li>#{tag}</li>
        {% endfor %}
      </ul>
    </li>
  {% endfor %}
</ul>
