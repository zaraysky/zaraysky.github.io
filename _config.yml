title: "Мой блог"
description: >-
  Лаконичный блог о разработке, дизайне и всём остальном.
baseurl: ""
url: "https://username.github.io"
author: "Ваше Имя"

markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-feed

collections:
  posts:
    output: true
    permalink: /:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
